<style>
  :root{
    --bg:#0f1217; --bg2:#151a22; --card:#1c222c; --ink:#eef1f6; --muted:#9aa3b2;
    --line:#2a313d; --accent:#3f8ee0; --accent2:#8ec3f7; --gr:#e0b458; --ok:#4fc98a; --ph:#18222f;
    --shadow:0 10px 34px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#eef1f5;--bg2:#f7f8fb;--card:#ffffff;--ink:#20242b;--muted:#6b7280;--line:#e3e6ec;
      --accent:#1466b3;--accent2:#0f4f8a;--gr:#b8862b;--ok:#2e7d5b;--ph:#eef4fb;--shadow:0 10px 30px rgba(30,40,60,.10);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  /* каркас: верхняя строка / карточка; карточка забирает всё свободное место */
  body{background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    height:100vh;height:100dvh;overflow:hidden;display:grid;
    grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"top" "stage";
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  body > #story365{display:none}

  .topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:8px 12px 2px}
  .deckSel{flex:1;min-width:0;height:42px;appearance:none;-webkit-appearance:none;font-size:15px;font-weight:700;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 34px 0 12px;cursor:pointer;
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
  .ibtn{flex:none;appearance:none;height:42px;min-width:42px;padding:0 10px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:4px}
  .ibtn:active,.btn:active{transform:translateY(1px)}
  .ibtn svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .stage{grid-area:stage;position:relative;min-height:0}
  .scene{position:absolute;inset:8px 12px 12px;margin:auto;max-width:760px;max-height:860px;perspective:1600px}
  .card{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);
    transform-style:preserve-3d;cursor:pointer}
  .card.flipped{transform:rotateY(180deg)}
  /* iOS Safari ловит нажатия и невидимой стороной — отключаем её явно */
  .card:not(.flipped) .back,.card.flipped .front{pointer-events:none}
  .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:66px 22px 80px}
  .sound{position:absolute;top:12px;right:12px;z-index:2;appearance:none;border:1px solid var(--line);
    background:var(--bg2);color:var(--accent2);font-size:20px;line-height:1;width:46px;height:46px;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    -webkit-backface-visibility:hidden;backface-visibility:hidden}
  .sound:active{transform:scale(.92)}
  .sound.speaking,.sound-ex.speaking{background:var(--accent);border-color:var(--accent);color:#fff}
  #sback{visibility:hidden}
  .card.flipped #sfront{visibility:hidden}
  .card.flipped #sback{visibility:visible}
  .front .word{width:100%;font-size:48px;font-weight:800;color:var(--accent2);line-height:1.12}
  /* размер текста на обороте задаётся одной переменной --fs, её подбирает fitCard() */
  .back{transform:rotateY(180deg);--fs:22px;font-size:var(--fs);gap:.3em}
  .back > :not(.sound){width:100%}

  .back .rub{font-size:1em;font-weight:700;line-height:1.2}
  .back .exline{border-top:1px solid var(--line);margin-top:.45em;padding-top:.6em;display:flex;flex-direction:column;align-items:center}
  .back .exg{font-size:.8em;font-weight:600;line-height:1.3}
  .back .exr{font-size:.64em;color:var(--muted);margin-top:.2em;line-height:1.3}
  .sound-ex{display:inline-flex;align-items:center;gap:5px;margin-top:.7em;border:1px solid var(--line);
    background:var(--bg2);color:var(--accent2);font-size:max(12.5px,.55em);font-weight:700;padding:6px 12px;border-radius:999px;

  #sex{visibility:hidden}
  .card.flipped #sex{visibility:visible}
  /* кнопки поверх карточки: не переворачиваются вместе с ней */
  .cnav{position:absolute;bottom:12px;z-index:3;appearance:none;width:56px;height:56px;border-radius:50%;padding:0 0 3px;
    border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 22%,var(--card));
    color:var(--ink);font-size:30px;line-height:1;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .cnav:active,.cfs:active,.cknow:active{transform:scale(.95)}
  #prev{left:12px}
  #next{right:12px}
  /* верхняя строка карточки: «на весь экран» слева, «Знаю» и счётчик по центру; справа место для 🔊 */
  .ctop{position:absolute;top:12px;left:12px;right:12px;height:46px;z-index:3;display:grid;grid-template-columns:46px 1fr 46px;
    align-items:center;pointer-events:none}
  .ctop button{pointer-events:auto}
  .cmid{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
  .cfs{flex:none;appearance:none;width:46px;height:46px;padding:0;border-radius:50%;border:1px solid var(--line);
    background:var(--bg2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .cfs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .cknow{flex:none;appearance:none;height:34px;padding:0 12px;border-radius:999px;
    border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--bg2);color:var(--ok);
    font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .cknow.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}
  .counter{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .toast{position:absolute;left:50%;top:70px;translate:-50% 0;z-index:5;max-width:calc(100% - 40px);background:var(--ink);color:var(--bg);
    font-size:13.5px;line-height:1.4;padding:10px 14px;border-radius:12px;text-align:center;pointer-events:none;
    opacity:0;transition:opacity .25s}
  .toast.on{opacity:1}
  .done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
  .done h2{margin:0;font-size:24px}

  .btn{appearance:none;height:56px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:16px;font-weight:700;padding:0 16px;border-radius:16px;cursor:pointer;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center}
  .ic-out{display:none}
  body.focus .ic-in{display:none}
  body.focus .ic-out{display:block}
  /* режим «на весь экран»: остаётся только карточка */
  body.focus .topbar{display:none}

  /* горизонтально: верхняя строка тоньше, карточка получает почти всю высоту */
  @media (orientation:landscape) and (max-height:600px){

  }

  .sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}

  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);
    font-size:14px;font-weight:700;padding:10px 6px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .mitem{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);

  .foot{text-align:center;font-size:12px;color:var(--muted);padding-top:4px}

  .nojs{margin:20px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:15px;line-height:1.6}
</style>

function stressify(t){return t.replace(/\|([^|]+)\|/g,'<span class="stress">$1</span>');}
// артикль не отрывается от слова при переносе
function glueArt(t){return t.replace(/^(ο|η|το|οι|τα|τον|την|τη|τους|τις) /i,'$1\u00a0');}
function Lg(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function Sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const $=id=>document.getElementById(id);

let deckId = Lg('gr_deck', DECKS[0].id);
if(!DECKS.some(d=>d.id===deckId)) deckId=DECKS[0].id;
let mode = Lg('gr_mode','fwd');
let hideLearned = Lg('gr_hide',false);
let learned, order, pos=0, flipped=false;
function deck(){ return DECKS.find(d=>d.id===deckId); }
function loadDeck(){
  const d=deck(), N=d.cards.length;
  learned = new Set(Lg('gr_learned_'+d.id,[]));
  order = Lg('gr_order_'+d.id,null);
  if(!order || order.length!==N){ order=shuffleArr([...Array(N).keys()]); Sv('gr_order_'+d.id,order); }
  pos=0; flipped=false;
}
function visible(){ return hideLearned ? order.filter(i=>!learned.has(i)) : order; }

function render(){
  const d=deck(), N=d.cards.length, list=visible(), doneState=(hideLearned && list.length===0);
  $('done').style.display = doneState?'flex':'none';
  $('scene').style.display = doneState?'none':'block';
  $('prog').textContent = 'выучено '+learned.size+' / '+N;
  $('deckSel').value = deckId;
  $('mFwd').classList.toggle('on',mode==='fwd');
  $('mRev').classList.toggle('on',mode==='rev');
  $('modeBtn').textContent = mode==='fwd' ? '🇬🇷→🇷🇺' : '🇷🇺→🇬🇷';
  $('hideToggle').textContent = 'Скрывать выученные: '+(hideLearned?'вкл':'выкл');
  if(doneState) return;
  if(pos>=list.length) pos=0; if(pos<0) pos=list.length-1;
  const c=d.cards[list[pos]];
  flipped=false; $('card').classList.remove('flipped');
  $('front').innerHTML = mode==='fwd' ? glueArt(c[0]) : c[2];
  $('know').classList.toggle('on', learned.has(list[pos]));
  $('b_gr').textContent=glueArt(c[0]); $('b_tr').innerHTML=stressify(c[1]); $('b_tr').style.display=c[1]?'':'none'; $('b_ru').textContent=c[2];
  $('b_exg').textContent=c[3]; $('b_exr').textContent=c[4]; $('exline').style.display=c[3]?'':'none';
  $('counter').textContent = (pos+1)+' / '+list.length;
  fitCard();
}
// подбирает самый крупный шрифт, при котором текст ещё помещается в карточку
function fitSize(lo,hi,set,overflows){
  for(let i=0;i<9;i++){ const m=(lo+hi)/2; set(m); if(overflows()) hi=m; else lo=m; }
  set(lo);
}
function fitCard(){
  const f=document.querySelector('.front'), b=document.querySelector('.back'), w=$('front');
  const W=f.clientWidth, H=f.clientHeight;
  if(!W||!H) return;
  const fitFront=()=>fitSize(18, Math.min(W*0.3,H*0.45,130), x=>w.style.fontSize=x+'px',
    ()=>w.scrollWidth>w.clientWidth+1 || f.scrollHeight>f.clientHeight+1);
  // сначала в одну строку (чтобы артикль не отрывался), перенос — только если иначе выйдет мелко
  w.style.whiteSpace='nowrap'; fitFront();
  if(parseFloat(w.style.fontSize)<36){ w.style.whiteSpace=''; fitFront(); }
  const parts=b.querySelectorAll('.grb,.rub,.exg,.exr');
  fitSize(12, Math.min(W*0.09,36), x=>b.style.setProperty('--fs',x+'px'),
    ()=>b.scrollHeight>b.clientHeight+1 || [...parts].some(e=>e.scrollWidth>e.clientWidth+1));
}
function step(n){ const list=visible(); if(!list.length)return; pos=(pos+n+list.length)%list.length; render(); }
let toastT=0;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),4000); }
let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices(); }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.addEventListener?.('voiceschanged',loadVoices); }
let curUtt=null; // держим ссылку: иначе iOS может выбросить фразу, не договорив
function speakGreek(text,btn){
  if(!text) return;
  if(!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance){ toast('Озвучка недоступна в этом браузере'); return; }
  try{
    const ss=speechSynthesis;
    if(!voices.length) loadVoices();
    const v=voices.find(x=>/^el/i.test(x.lang));
    if(voices.length && !v) toast('Нет греческого голоса: Настройки → Универсальный доступ → Устный контент → Голоса → Греческий');
    const u=new SpeechSynthesisUtterance(text); u.lang='el-GR'; u.rate=0.9; if(v) u.voice=v;
    const off=()=>{ if(btn) btn.classList.remove('speaking'); };
    u.onstart=()=>{ if(btn) btn.classList.add('speaking'); };
    u.onend=off;
    u.onerror=e=>{ off(); if(e.error && e.error!=='interrupted' && e.error!=='canceled') toast('Озвучка не сработала: '+e.error); };
    curUtt=u;
    if(ss.speaking || ss.pending) ss.cancel();
    ss.speak(u);
    if(ss.paused) ss.resume();
  }catch(e){ toast('Озвучка не сработала: '+e.message); }
}
function curCard(){ const list=visible(); return list.length ? deck().cards[list[pos]] : null; }
function soundTap(e){ e.stopPropagation(); e.preventDefault(); const c=curCard(); if(c) speakGreek(c[0],e.currentTarget); }
function soundEx(e){ e.stopPropagation(); e.preventDefault(); const c=curCard(); if(c) speakGreek(c[3],e.currentTarget); }

$('card').addEventListener('click',()=>{ flipped=!flipped; $('card').classList.toggle('flipped',flipped); });
['sfront','sback'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('click',soundTap); });
$('sex').addEventListener('click',soundEx);
$('next').addEventListener('click',()=>step(1));
$('prev').addEventListener('click',()=>step(-1));
$('shuffle').addEventListener('click',()=>{ closeMenu(); order=shuffleArr([...Array(deck().cards.length).keys()]); Sv('gr_order_'+deckId,order); pos=0; render(); });
// «Знаю» — переключатель: отметить / снять отметку, без перехода к следующему слову
$('know').addEventListener('click',()=>{ const list=visible(); if(!list.length)return; const i=list[pos];
  if(learned.has(i)) learned.delete(i); else learned.add(i);
  Sv('gr_learned_'+deckId,[...learned]); render(); });
$('mFwd').addEventListener('click',()=>{ mode='fwd'; Sv('gr_mode',mode); render(); });
$('mRev').addEventListener('click',()=>{ mode='rev'; Sv('gr_mode',mode); render(); });
$('modeBtn').addEventListener('click',()=>{ mode=mode==='fwd'?'rev':'fwd'; Sv('gr_mode',mode); render(); });
function closeMenu(){ $('sheet').hidden=true; }
$('menuBtn').addEventListener('click',()=>{ $('sheet').hidden=false; });
$('sheet').addEventListener('click',e=>{ if(e.target===$('sheet')) closeMenu(); });
let focusMode = Lg('gr_focus',false);
document.body.classList.toggle('focus',focusMode);
$('focusBtn').addEventListener('click',()=>{ focusMode=!focusMode; Sv('gr_focus',focusMode); document.body.classList.toggle('focus',focusMode); });
$('hideToggle').addEventListener('click',()=>{ hideLearned=!hideLearned; Sv('gr_hide',hideLearned); pos=0; render(); });
$('reset').addEventListener('click',()=>{ if(confirm('Сбросить прогресс этой колоды?')){ learned=new Set(); Sv('gr_learned_'+deckId,[]); closeMenu(); render(); } });
$('resetDone').addEventListener('click',()=>{ learned=new Set(); Sv('gr_learned_'+deckId,[]); pos=0; render(); });
$('deckSel').addEventListener('change',e=>{ deckId=e.target.value; Sv('gr_deck',deckId); loadDeck(); render(); });

// swipe
let sx=0,sy=0;
const stage=document.querySelector('.stage');
stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1);},{passive:true});

$('deckSel').innerHTML = DECKS.map(d=>'<option value="'+d.id+'">'+d.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')+'</option>').join('');
loadDeck(); render();
if('ResizeObserver' in window) new ResizeObserver(fitCard).observe($('scene')); else addEventListener('resize',fitCard);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitCard);
// блок «Разборы 365» дописывается в конец страницы — переносим его в меню
document.addEventListener('DOMContentLoaded',()=>{ const st=$('story365'); if(st) $('storySlot').appendChild(st); });

// авто-обновление: сеть-первой через service worker
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

</script>

<div id="story365" style="max-width:520px;margin:10px auto 44px;padding:0 16px;text-align:center"><label for="storySel" style="display:block;font-size:13.5px;color:var(--muted,#6b7280);margin-bottom:6px">Разборы 365</label><select id="storySel" onchange="if(this.value)location.href=this.value" style="width:100%;max-width:360px;padding:9px 12px;font-size:14.5px;border-radius:12px;border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#20242b)"><option value="">— выбери разбор —</option><option value="365/07-22/index.html">07-22 - Μεγάλη κοιλιά</option><option value="365/08-01/index.html">08-01 - Η σοκολάτα</option><option value="365/09-16/index.html">09-16 - Οι τηγανίτες</option></select></div>
</body>
</html>
